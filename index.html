<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : utilise tout l'écran des iPhone (encoche), géré par les "safe areas" du CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="color-scheme" content="light">
  <title>MedQCM — Révision médicale intelligente</title>

  <!-- Web app : installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MedQCM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barre du haut -->
  <header class="topbar">
    <div class="container topbar-inner">
      <button type="button" class="brand" data-action="home" aria-label="MedQCM, retour à l’accueil">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg>
        </span>
        <span class="brand-name">MedQCM</span>
      </button>
      <button type="button" class="home-link" id="home-btn" data-action="home" hidden>Accueil</button>
    </div>
  </header>

  <!-- Contenu : rempli par script.js (page d'activation, puis application) -->
  <main id="app" class="container">
    <noscript>
      <p class="noscript">MedQCM a besoin de JavaScript pour fonctionner. Activez JavaScript dans votre navigateur.</p>
    </noscript>
  </main>

  <footer class="footer container">
    <p>Votre progression est enregistrée automatiquement sur cet appareil.</p>
    <!-- Caché par défaut : voir SHOW_CHANGE_CODE_BUTTON dans activation.js -->
    <button type="button" class="link-btn" id="change-code-btn" data-action="deactivate" hidden>Changer de code</button>
  </footer>

  <!-- Ordre important : questions, activation, puis la logique de l'application -->
  <script src="questions.js"></script>
  <script src="activation.js"></script>
  <script src="script.js"></script>
</body>
</html>
